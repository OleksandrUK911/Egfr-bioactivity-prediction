name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install rdkit scikit-learn pandas numpy lightgbm pytest flake8

      - name: Lint
        run: flake8 app.py fetch_data.py run_notebook.py --max-line-length 120

      - name: Unit tests
        run: pytest tests/ -v
